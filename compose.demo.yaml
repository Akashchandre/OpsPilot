x-demo-runtime-environment: &demo-runtime-environment
  NODE_ENV: production
  LOG_LEVEL: info
  TRUST_PROXY_HOPS: 2
  CORS_ORIGIN: ${OPSPILOT_DEMO_PUBLIC_ORIGIN:?set the generated CloudFront HTTPS origin in demo.env}
  AUTH_COOKIE_SECURE: "true"
  RAZORPAY_ENABLED: "true"
  RAZORPAY_KEY_ID: ${OPSPILOT_DEMO_RAZORPAY_KEY_ID:?set the Razorpay Test Mode key ID in demo.env}
  RAZORPAY_KEY_SECRET: ${OPSPILOT_DEMO_RAZORPAY_KEY_SECRET:?set the Razorpay Test Mode key secret in demo.env}
  RAZORPAY_WEBHOOK_SECRET: ${OPSPILOT_DEMO_RAZORPAY_WEBHOOK_SECRET:?set the Razorpay Test Mode webhook secret in demo.env}
  AI_ENABLED: "false"
  AI_WORKFLOWS_ENABLED: "false"
  DOCUMENTS_ENABLED: "false"

services:
  mysql:
    restart: unless-stopped

  api:
    restart: unless-stopped
    environment:
      <<: *demo-runtime-environment

  worker:
    restart: unless-stopped
    environment:
      <<: *demo-runtime-environment

  web:
    profiles: ["app"]
    image: opspilot-web:demo
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: ${OPSPILOT_DEMO_PUBLIC_ORIGIN:?set the generated CloudFront HTTPS origin in demo.env}/api/v1
        VITE_CSRF_COOKIE_NAME: opspilot_csrf
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
        restart: true
    ports:
      - "0.0.0.0:${OPSPILOT_DEMO_HTTP_PORT:-80}:8080"
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.25
    stop_grace_period: 15s
