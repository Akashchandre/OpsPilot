name: opspilot

services:
  mysql:
    image: opspilot-mysql:phase10
    build:
      context: .
      dockerfile: docker/mysql.Dockerfile
    user: "999:999"
    restart: "no"
    environment:
      MYSQL_DATABASE: opspilot_compose
      MYSQL_USER: opspilot
      MYSQL_PASSWORD: ${OPSPILOT_COMPOSE_MYSQL_PASSWORD:?set in compose.env}
      MYSQL_ROOT_PASSWORD: ${OPSPILOT_COMPOSE_MYSQL_ROOT_PASSWORD:?set in compose.env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=tcp --host=127.0.0.1
          --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}"
          --execute='SELECT 1' >/dev/null 2>&1
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - internal
    volumes:
      - mysql-data:/var/lib/mysql
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0

  migrate:
    profiles: ["app"]
    image: opspilot-migration:phase10
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      target: migration
    restart: "no"
    environment:
      DATABASE_URL: ${OPSPILOT_COMPOSE_DATABASE_URL:?set in compose.env}
      SHADOW_DATABASE_URL: ${OPSPILOT_COMPOSE_SHADOW_DATABASE_URL:?set in compose.env}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.5

  api:
    profiles: ["app"]
    image: opspilot-node:phase10
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      target: runtime
    restart: "no"
    init: true
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 4000
      LOG_LEVEL: info
      TRUST_PROXY_HOPS: 0
      CORS_ORIGIN: ${OPSPILOT_COMPOSE_CORS_ORIGIN:-http://127.0.0.1:5173}
      DATABASE_URL: ${OPSPILOT_COMPOSE_DATABASE_URL:?set in compose.env}
      DATABASE_PROBE_INTERVAL_MS: ${OPSPILOT_COMPOSE_DATABASE_PROBE_INTERVAL_MS:-5000}
      DATABASE_FAILURE_EXIT_MS: ${OPSPILOT_COMPOSE_DATABASE_FAILURE_EXIT_MS:-30000}
      AUTH_COOKIE_SECURE: "false"
      RAZORPAY_ENABLED: "false"
      AI_ENABLED: ${OPSPILOT_COMPOSE_AI_ENABLED:-false}
      AI_SERVICE_URL: http://127.0.0.1:8000
      AI_SERVICE_SIGNING_KEY: ${OPSPILOT_COMPOSE_AI_SIGNING_KEY:-}
      AI_SERVICE_SIGNING_KEY_ID: ${OPSPILOT_COMPOSE_AI_SIGNING_KEY_ID:-}
      AI_WORKFLOWS_ENABLED: "false"
      DOCUMENTS_ENABLED: "false"
      AUDIT_INTEGRITY_KEY: ${OPSPILOT_COMPOSE_AUDIT_INTEGRITY_KEY:?set in compose.env}
      AUDIT_INTEGRITY_KEY_ID: ${OPSPILOT_COMPOSE_AUDIT_INTEGRITY_KEY_ID:-compose-local-v1}
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${OPSPILOT_COMPOSE_API_HOST_PORT:-4000}:4000"
    networks:
      - internal
      - edge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 40s

  worker:
    profiles: ["app"]
    image: opspilot-node:phase10
    restart: "no"
    init: true
    command: ["node", "apps/api/src/worker.js"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      CORS_ORIGIN: ${OPSPILOT_COMPOSE_CORS_ORIGIN:-http://127.0.0.1:5173}
      DATABASE_URL: ${OPSPILOT_COMPOSE_DATABASE_URL:?set in compose.env}
      DATABASE_PROBE_INTERVAL_MS: ${OPSPILOT_COMPOSE_DATABASE_PROBE_INTERVAL_MS:-5000}
      DATABASE_FAILURE_EXIT_MS: ${OPSPILOT_COMPOSE_DATABASE_FAILURE_EXIT_MS:-30000}
      RAZORPAY_ENABLED: "false"
      AI_ENABLED: ${OPSPILOT_COMPOSE_AI_ENABLED:-false}
      AI_SERVICE_URL: http://127.0.0.1:8000
      AI_SERVICE_SIGNING_KEY: ${OPSPILOT_COMPOSE_AI_SIGNING_KEY:-}
      AI_SERVICE_SIGNING_KEY_ID: ${OPSPILOT_COMPOSE_AI_SIGNING_KEY_ID:-}
      AI_WORKFLOWS_ENABLED: "false"
      DOCUMENTS_ENABLED: "false"
      AUDIT_INTEGRITY_KEY: ${OPSPILOT_COMPOSE_AUDIT_INTEGRITY_KEY:?set in compose.env}
      AUDIT_INTEGRITY_KEY_ID: ${OPSPILOT_COMPOSE_AUDIT_INTEGRITY_KEY_ID:-compose-local-v1}
    depends_on:
      api:
        condition: service_healthy
        restart: true
    network_mode: service:api
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 40s
    healthcheck:
      disable: true

  ai:
    profiles: ["ai"]
    image: opspilot-ai:phase10
    build:
      context: .
      dockerfile: docker/ai.Dockerfile
      target: runtime
    restart: "no"
    init: true
    environment:
      AI_ENVIRONMENT: development
      AI_HOST: 127.0.0.1
      AI_PORT: 8000
      AI_LOG_LEVEL: info
      AI_PROVIDER_ENABLED: "false"
      AI_SERVICE_SIGNING_KEY: ${OPSPILOT_COMPOSE_AI_SIGNING_KEY:-}
      AI_SERVICE_SIGNING_KEY_ID: ${OPSPILOT_COMPOSE_AI_SIGNING_KEY_ID:-}
      GROQ_REQUIRE_ZERO_DATA_RETENTION: "true"
      GROQ_ZERO_DATA_RETENTION_CONFIRMED: "false"
      AI_RAG_ENABLED: "false"
      AI_WORKFLOWS_ENABLED: "false"
    depends_on:
      api:
        condition: service_healthy
        restart: true
    network_mode: service:api
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 40s

networks:
  internal:
    internal: true
  edge:

volumes:
  mysql-data:
