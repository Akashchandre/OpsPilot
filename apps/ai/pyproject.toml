[project]
name = "opspilot-ai"
version = "0.1.0"
description = "OpsPilot internal AI policy and Groq provider service"
requires-python = ">=3.13,<3.14"

[dependency-groups]
runtime = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "python-dotenv==1.2.3",
  "qdrant-client==1.19.0",
  "fastembed==0.8.0",
  "uvicorn==0.52.4",
]
dev = [
  { include-group = "runtime" },
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.5",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "cross_service: runs the explicit local Node-to-FastAPI HTTP contract smoke",
]

[tool.coverage.run]
branch = true
source = ["opspilot_ai"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
